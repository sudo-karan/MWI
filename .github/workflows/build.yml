name: Build

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run crypto/security unit tests
        run: ./gradlew :shared:testDebugUnitTest --console=plain --stacktrace

      - name: Assemble debug APK (github flavor)
        run: ./gradlew :app:assembleGithubDebug --console=plain --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mwi-github-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: warn

  release:
    # Publishes a signed APK to Releases on tag pushes. Uses a throwaway keystore
    # when signing secrets are not configured (spec §12).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "No signing secrets set — generating a throwaway keystore."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias mwi \
              -storepass throwaway -keypass throwaway -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=MWI, OU=MWI, O=MWI, L=LAN, S=LAN, C=US"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=throwaway
          keyAlias=mwi
          keyPassword=throwaway
          EOF
          fi

      - name: Assemble signed release APK
        run: ./gradlew :app:assembleGithubRelease --console=plain --stacktrace

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/github/release/*.apk
