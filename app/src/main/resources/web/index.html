<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MWI — Web Console</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B7285" />
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <div id="app">
        <div class="login-wrap"><div class="empty"><span class="spinner"></span> Starting…</div></div>
    </div>

    <script>
        // Replaced verbatim by the server at serve time with the phone's clock (spec §6); the leading
        // fallback keeps the file valid when opened outside the server. Used by the client to align
        // replay-protection timestamps with the phone regardless of browser clock skew.
        window.__SERVER_TIME__ = window.__SERVER_TIME__ || null;
    </script>
    <script src="/crypto.js"></script>
    <script src="/api.js"></script>
    <script src="/app.js"></script>
</body>
</html>
