# Project-wide Gradle settings for MWI (Mobile Web Interface)

# JVM args for the Gradle daemon. Reflection-heavy stack (Ktor/kGraphQL) benefits from headroom.
org.gradle.jvmargs=-Xmx4g -Xms512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# R8/minify is intentionally OFF for release in this project (see PRIVACY.md / spec §3):
# the reflection-heavy Ktor + kGraphQL stack crashes when minified without a fully
# verified keep set. Keep rules live in proguard-rules.pro for optional later use.
